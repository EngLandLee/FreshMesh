# APISIX standalone (etcd-less) data plane configuration.
# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 FreshMesh-DXOS contributors
apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: false
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
nginx_config:
  error_log: /dev/stderr
  error_log_level: warn
  access_log: /dev/stdout
  access_log_format: '$remote_addr [$time_iso8601] "$request" $status $request_time "$http_x_request_id"'
plugins:
  - request-id
  - limit-count
  - proxy-rewrite
