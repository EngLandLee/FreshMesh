name: Feature request
description: Propose an operationally justified improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: Who is blocked, and what decision or workflow is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe API/UI/workflow changes and authorization boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include successful, denied, retry/idempotency, and persistence paths where relevant.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This does not require copying unlicensed parent source or shipping secrets.
          required: true
        - label: I have considered dependency license and security impact.
          required: true
