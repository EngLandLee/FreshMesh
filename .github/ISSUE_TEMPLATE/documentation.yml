name: Documentation or license correction
description: Report an incorrect source-build instruction, demo step or dependency notice
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: version
    attributes:
      label: Release tag or commit
      description: State the version you actually used.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: File, section or dependency
      description: Link to the affected document or identify the dependency and pinned version.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or missing?
      description: For commands, include reproducible steps and redacted output. For licensing, link the upstream license or advisory.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Explain the correct command, behavior or attribution; do not paste third-party source.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe disclosure
      options:
        - label: This contains no secrets or personal data; exploitable vulnerabilities are reported privately instead.
          required: true
