name: SBOM
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  actions: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    # Only this trusted release/manual job needs to attach SBOM release assets.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: freshmesh-olp-sbom.cdx.json
