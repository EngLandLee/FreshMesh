name: SBOM
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  actions: read
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: freshmesh-olp-sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshmesh-olp-sbom
          path: sbom.cdx.json
