name: Publish static introduction to Pages
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref whose website source and release image URLs are used
        required: false
        type: string
        default: main
      verified_site_artifact:
        description: Artifact from the calling run containing an already checked dist/site
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to publish (existing release screenshots are fetched when needed)
        required: true
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: pages-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - name: Download exact verified site from caller
        if: ${{ inputs.verified_site_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.verified_site_artifact }}
          path: dist/site
      - uses: actions/setup-node@v4
        if: ${{ inputs.verified_site_artifact == '' }}
        with:
          node-version: 22
          cache: npm
      - name: Install static-site browser checker
        if: ${{ inputs.verified_site_artifact == '' }}
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Build and check selected ref
        if: ${{ inputs.verified_site_artifact == '' }}
        run: |
          make site
          python3 -m http.server 3181 --bind 127.0.0.1 --directory dist/site >"$RUNNER_TEMP/freshmesh-pages.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/freshmesh-pages.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3181/ >/dev/null; then
              make site-check
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/freshmesh-pages.log"
          exit 1
      - name: Verify Pages payload exists
        run: test -s dist/site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages payload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact checked Pages payload
        id: deployment
        uses: actions/deploy-pages@v4
