name: Docker end-to-end
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: freshmesh-e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser verification dependencies
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Build and start real stack
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans || true
          docker compose -p "$COMPOSE_PROJECT_NAME" up --build -d
      - name: Wait for public health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3180/api/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" ps
          docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color
          exit 1
      - name: Exercise authenticated business flow
        run: python3 scripts/demo-check.py --base-url http://localhost:3180
      - name: Exercise read-only route map controls and boundaries
        run: npm run test:map
      - name: Exercise and capture genuine multi-role portal evidence
        run: make screenshots
      - name: Build static introduction
        run: make site
      - name: Serve and check static introduction
        run: |
          python3 -m http.server 3181 --bind 127.0.0.1 --directory dist/site >"$RUNNER_TEMP/freshmesh-site.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/freshmesh-site.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3181/ >/dev/null; then
              make site-check
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/freshmesh-site.log"
          exit 1
      - name: Upload browser and site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}
          path: |
            dist/screenshots
            dist/site
          if-no-files-found: warn
          retention-days: 14
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color
      - name: Stop only this CI stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans
