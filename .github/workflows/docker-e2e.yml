name: Docker end-to-end
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verification dependencies
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Build and start real stack
        run: docker compose up --build -d
      - name: Wait for public health endpoint
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:3180/api/health && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Exercise authenticated business flow
        run: python3 scripts/demo-check.py --base-url http://localhost:3180
      - name: Exercise genuine multi-role portal in Chromium
        run: make ui-check
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
