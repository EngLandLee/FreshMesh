<text x="76" y="218" font-size="30">Hàng tươi đúng nơi. Giao nhận rõ trách nhiệm.</text>
<text x="76" y="290" font-size="20" fill="#b6d9bb">Đề xuất · Phê duyệt · Lập tuyến · Giao hàng · Xác nhận</text>
<text x="76" y="378" font-size="17" fill="#b6d9bb">OPEN SOURCE / APACHE-2.0</text>
</g>
<g stroke="#b6d9bb" stroke-width="3" fill="none">
<path d="M1080 112 V208 H1256 V320"/>
<path d="M1080 208 H1016 V320"/>
