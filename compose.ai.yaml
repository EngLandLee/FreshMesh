services:
  api:
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
  ollama:
    image: ollama/ollama:0.6.8
    profiles: [ai]
    volumes:
      - ollama-data:/root/.ollama
    expose: ["11434"]
    restart: unless-stopped
volumes:
  ollama-data:
