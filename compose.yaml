name: freshmesh

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshmesh}
      POSTGRES_USER: ${POSTGRES_USER:-freshmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--http-enabled=true", "--http-port=8080", "--http-relative-path=/auth", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-keycloak-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freshmesh}
      KC_DB_USERNAME: ${POSTGRES_USER:-freshmesh}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
      KC_HOSTNAME: ${PORTAL_URL:-http://localhost:3180}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/keycloak/freshmesh-realm.json:/opt/keycloak/data/import/freshmesh-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080", "9000"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"UP\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"freshmesh","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -ip=storage
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-freshmesh-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-demo-seaweed-secret}
    volumes:
      - seaweed-data:/data
    expose: ["8333", "9333", "8888"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://storage:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  gateway:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./deploy/gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./deploy/gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    expose: ["9080", "9180"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080; printf \"GET /api/config HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  workflow:
    build:
      context: ./workflow
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freshmesh}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-freshmesh}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-demo-postgres-password}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freshmesh}:${POSTGRES_PASSWORD:-demo-postgres-password}@postgres:5432/${POSTGRES_DB:-freshmesh}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:3180/auth/realms/freshmesh}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/auth/realms/freshmesh/protocol/openid-connect/certs}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-freshmesh-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-demo-seaweed-secret}
      S3_BUCKET: ${S3_BUCKET:-freshmesh-documents}
      WORKFLOW_URL: ${WORKFLOW_URL:-http://workflow:8080}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3180}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      storage:
        condition: service_healthy
      workflow:
        condition: service_healthy
    expose: ["8100"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:3180:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ | grep -q '<' "]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:
  seaweed-data:
