server.port=${SERVER_PORT:8080}
server.error.include-message=never
spring.application.name=freshmesh-workflow
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freshmesh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:freshmesh}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:freshmesh}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
flowable.database-schema-update=true
flowable.check-process-definitions=true
flowable.async-executor-activate=false
flowable.history-level=full
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
